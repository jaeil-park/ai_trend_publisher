<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat UI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #b2c7d9;
      display: flex;
      flex-direction: column;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .chat-header {
      background: #2e5f7a;
      color: #fff;
      padding: 4vh 4vw 2vh;
      font-size: 4vw;
      font-weight: bold;
      text-align: center;
      letter-spacing: 0.2vw;
    }

    .chat-body {
      flex: 1;
      padding: 3vh 3vw;
      display: flex;
      flex-direction: column;
      gap: 2vh;
      overflow: hidden;
    }

    .bubble {
      max-width: 80%;
      padding: 2.5vh 3vw;
      border-radius: 3vw;
      font-size: 3.5vw;
      line-height: 1.5;
    }

    .bubble.left {
      align-self: flex-start;
      background: #fff;
      color: #222;
      border-bottom-left-radius: 0.5vw;
    }

    .bubble.right {
      align-self: flex-end;
      background: #fee500;
      color: #111;
      border-bottom-right-radius: 0.5vw;
    }

    .bubble .sender {
      font-size: 2.8vw;
      color: #888;
      margin-bottom: 0.8vh;
    }

    .chat-footer {
      background: #e8e8e8;
      padding: 2.5vh 3vw;
      font-size: 3vw;
      color: #aaa;
      text-align: center;
    }

    /* --- 템플릿 변수 주입 영역 --- */
    /* {{CHAT_TITLE}}, {{MESSAGES}} */
  </style>
</head>
<body>
  <div class="chat-header">{{CHAT_TITLE}}</div>

  <div class="chat-body">
    <!-- {{MESSAGES}} : <div class="bubble left/right"><div class="sender">닉네임</div>내용</div> 반복 -->
    {{MESSAGES}}
  </div>

  <div class="chat-footer">실시간 반응 모음</div>
</body>
</html>
