<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>Chat UI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1080px;
      height: 1920px;
      background: #b2c7d9;
      display: flex;
      flex-direction: column;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .chat-header {
      background: #2e5f7a;
      color: #fff;
      padding: 50px 40px 30px;
      font-size: 40px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 2px;
    }

    .chat-body {
      flex: 1;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      overflow: hidden;
    }

    .bubble {
      max-width: 75%;
      padding: 28px 36px;
      border-radius: 36px;
      font-size: 34px;
      line-height: 1.5;
    }

    .bubble.left {
      align-self: flex-start;
      background: #fff;
      color: #222;
      border-bottom-left-radius: 8px;
    }

    .bubble.right {
      align-self: flex-end;
      background: #fee500;
      color: #111;
      border-bottom-right-radius: 8px;
    }

    .bubble .sender {
      font-size: 26px;
      color: #888;
      margin-bottom: 8px;
    }

    .chat-footer {
      background: #e8e8e8;
      padding: 28px 30px;
      font-size: 28px;
      color: #aaa;
      text-align: center;
    }

    /* --- 템플릿 변수 주입 영역 --- */
    /* {{CHAT_TITLE}}, {{MESSAGES}} */
  </style>
</head>
<body>
  <div class="chat-header">{{CHAT_TITLE}}</div>

  <div class="chat-body">
    <!-- {{MESSAGES}} : <div class="bubble left/right"><div class="sender">닉네임</div>내용</div> 반복 -->
    {{MESSAGES}}
  </div>

  <div class="chat-footer">실시간 반응 모음</div>
</body>
</html>
