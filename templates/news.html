<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breaking News UI Sequence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #050505;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(230, 0, 0, 0.15), transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(0, 85, 255, 0.1), transparent 50%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      display: flex;
      flex-direction: column;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 배경 그리드 장식 */
    .bg-grid {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 5vw 5vw;
      z-index: 1; pointer-events: none;
    }

    /* 상단 배너 */
    .news-ticker {
      background: #c80000;
      padding: 2vh 4vw;
      font-size: 3.5vw;
      font-weight: bold;
      letter-spacing: 0.2vw;
      box-shadow: 0 2px 20px rgba(200, 0, 0, 0.5);
      border-bottom: 1px solid #ff4d4d;
      text-transform: uppercase;
      z-index: 10;
    }

    /* 시퀀스 컨테이너 */
    .sequence-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    /* 각 뉴스 씬 */
    .scene {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6vh 8vw;
      gap: 4vh;
      max-width: 100%;

      /* 전환 애니메이션 처리 */
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      z-index: 5;
    }

    /* 텍스트 요소들 - 애니메이션 클래스 적용 시 동작 */
    .scene .news-tag     { transform: scale(0.8) translateY(30px); opacity: 0; filter: blur(5px); transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s; }
    .scene .news-headline{ transform: perspective(500px) rotateX(15deg) translateY(40px) scale(1.05); opacity: 0; filter: blur(10px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s; }
    .scene .news-summary { transform: translateX(-40px); opacity: 0; transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s; }
    .scene .news-source  { transform: translateY(20px); opacity: 0; transition: all 0.5s ease 0.7s; }

    .scene.active .news-tag     { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
    .scene.active .news-headline{ transform: perspective(500px) rotateX(0deg) translateY(0) scale(1); opacity: 1; filter: blur(0); }
    .scene.active .news-summary { transform: translateX(0); opacity: 1; }
    .scene.active .news-source  { transform: translateY(0); opacity: 1; }

    /* 모듈별 스타일 */
    .news-tag {
      display: inline-block;
      background: linear-gradient(135deg, #ff0b55, #c80000);
      box-shadow: 0 4px 15px rgba(200, 0, 0, 0.4);
      border-radius: 8vw;
      color: #fff;
      padding: 1.5vh 4vw;
      font-size: 3.2vw;
      font-weight: bold;
      width: fit-content;
      max-width: 100%;
    }

    .news-headline {
      font-size: 7.8vw;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.15vw;
      color: #fff;
      max-width: 100%;
      text-shadow: 0 5px 15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 255, 255, 0.1);
    }

    .news-summary {
      font-size: 4.8vw;
      font-weight: 500;
      line-height: 1.5;
      color: #e2e8f0;
      border-left: 1.2vw solid #ff0b55;
      padding-left: 4vw;
      background: linear-gradient(90deg, rgba(255, 11, 85, 0.1) 0%, transparent 80%);
      padding-top: 1.5vh;
      padding-bottom: 1.5vh;
      max-width: 100%;
    }

    .news-source {
      font-size: 3vw;
      color: #888;
      margin-top: 1vh;
      max-width: 100%;
    }

    /* 하단 로고 */
    .news-footer {
      background: #1a1a1a;
      padding: 3vh 6vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 3vw;
      color: #aaa;
      z-index: 20;
      width: 100%;
    }

    .news-footer .logo {
      font-size: 4vw;
      font-weight: bold;
      color: #e60000;
    }

    /* 프로그레스 바 (옵션) */
    .progress-bar-container {
      height: 8px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      z-index: 20;
    }

    .progress-bar {
      height: 100%;
      background: #ff0b55;
      box-shadow: 0 0 10px #ff0b55, 0 0 20px #ff0b55;
      width: 0%;
      transition: width linear;
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>
  <div class="news-ticker">🔴 오늘의 AI 핫이슈 · @jaeil.park</div>

  <div class="sequence-container">
    {% for scene in scenes %}
    <!-- 첫 번째 항목만 미리 active 클래스를 줘서 렌더링 시작 -->
    <div class="scene {% if loop.index0 == 0 %}active{% endif %}">
      <div class="news-tag">이슈 {{ loop.index }}</div>
      <div class="news-headline">{{ scene.hook_title }}</div>
      <div class="news-summary">{{ scene.summary }}</div>
      <div class="news-source">출처: {{ scene.source }}</div>
    </div>
    {% endfor %}
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="news-footer">
    <div class="logo">@jaeil.park</div>
    <div>infralog.kr · {{ published_at }}</div>
  </div>

  <script>
    // ── 타이핑 BGM (Web Audio API 합성) ──────────────────────────────────
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTypingClick() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      // 키 타격음: 짧고 높은 클릭
      osc.type = 'square';
      osc.frequency.setValueAtTime(
        800 + Math.random() * 400,   // 800~1200Hz 랜덤으로 변화감
        audioCtx.currentTime
      );
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.06);
    }

    let typingInterval = null;

    function startTypingSound() {
      if (!audioCtx) return;
      stopTypingSound();
      // 평균 120ms 간격, ±40ms 변동으로 자연스러운 타이핑 패턴
      function scheduleNext() {
        const delay = 80 + Math.random() * 80;
        typingInterval = setTimeout(() => {
          playTypingClick();
          scheduleNext();
        }, delay);
      }
      scheduleNext();
    }

    function stopTypingSound() {
      if (typingInterval) { clearTimeout(typingInterval); typingInterval = null; }
    }

    // AudioContext는 사용자 인터랙션 없이 바로 생성 (Playwright 환경)
    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startTypingSound();
      } catch(e) { /* 오디오 미지원 환경 무시 */ }
    }

    // 페이지 로드 직후 바로 시작 (Playwright는 user gesture 불필요)
    window.addEventListener('load', initAudio);
    document.addEventListener('click', initAudio, { once: true });

    // ── 씬 전환 스크립트 ──────────────────────────────────────────────────
    const scenes = document.querySelectorAll('.scene');
    const progressBar = document.getElementById('progressBar');

    let currentIndex = 0;
    const SCENE_DURATION_MS = 4000; // 씬 하나당 4초

    // 진행바 초기화
    if (scenes.length > 0) {
      progressBar.style.transitionDuration = SCENE_DURATION_MS + 'ms';
      progressBar.style.width = '100%';
    }

    setInterval(() => {
      if (scenes.length <= 1) return;

      // 현재 씬 끄기
      scenes[currentIndex].classList.remove('active');

      currentIndex++;
      if (currentIndex >= scenes.length) {
        currentIndex = scenes.length - 1;
      } else {
        scenes[currentIndex].classList.add('active');

        // 프로그레스 바 리셋 애니메이션 트릭
        progressBar.style.transitionDuration = '0ms';
        progressBar.style.width = '0%';
        setTimeout(() => {
          progressBar.style.transitionDuration = SCENE_DURATION_MS + 'ms';
          progressBar.style.width = '100%';
        }, 50);
      }
    }, SCENE_DURATION_MS);
  </script>
</body>

</html>
