name: AI Trend Auto Upload

on:
  schedule:
    # 카드뉴스(ai-card-publisher)와 30분~1시간 간격 유지하여 알고리즘 분산
    # KST 07:30 (UTC 22:30) — 출근 직전 피크
    # KST 13:00 (UTC 04:00) — 점심 피크
    # KST 20:30 (UTC 11:30) — 야간 피크
    - cron: "30 22 * * *"
    - cron: "0 4 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:

# 동시 실행 방지 — posted_history.json Gist 동기화 충돌 예방
concurrency:
  group: ai-trend-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 의존성 설치
        run: pip install -r requirements.txt

      - name: 🎬 FFmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 🎭 Playwright Chromium 설치
        run: playwright install chromium --with-deps

      - name: 🚀 파이프라인 실행
        run: python main.py
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          NEWSAPI_KEY:            ${{ secrets.NEWSAPI_KEY }}
          NAVER_CLIENT_ID:        ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:    ${{ secrets.NAVER_CLIENT_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_USER_ID:        ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN:   ${{ secrets.THREADS_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL:    ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIST_ID:                ${{ secrets.GIST_ID }}
          GH_PAT:                 ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:      ${{ github.repository }}

      - name: 📋 실행 결과 요약
        if: always()
        run: |
          echo "## 🤖 AI Trend Publisher 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 상태 | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 시각 (UTC) | $(date '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "| 트리거 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
