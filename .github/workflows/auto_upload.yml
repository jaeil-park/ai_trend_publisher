name: AI Trend Auto Upload

on:
  schedule:
    # 매일 KST 08:00(=UTC 23:00)
    - cron: "0 23 * * *"
  workflow_dispatch:

# 동시 실행 방지 — posted_history.json Gist 동기화 충돌 예방
concurrency:
  group: ai-trend-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.10 세팅
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 의존성 설치
        run: pip install -r requirements.txt

      - name: 🎬 FFmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 🎭 Playwright Chromium 설치
        run: playwright install chromium --with-deps

      - name: 🚀 파이프라인 실행
        run: python main.py
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          NEWSAPI_KEY:            ${{ secrets.NEWSAPI_KEY }}
          NAVER_CLIENT_ID:        ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:    ${{ secrets.NAVER_CLIENT_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GIST_ID:                ${{ secrets.GIST_ID }}
          GH_PAT:                 ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY:      ${{ github.repository }}

      - name: 📋 실행 결과 요약
        if: always()
        run: |
          echo "## 🤖 AI Trend Publisher 실행 결과" >> $GITHUB_STEP_SUMMARY
          echo "| 항목 | 값 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 상태 | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 실행 시각 (UTC) | $(date '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "| 트리거 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
